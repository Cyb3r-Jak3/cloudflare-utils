# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - task generate-docs

builds:
  - id: default
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm
      - arm64
      - '386'
      - s390x
      - ppc64le
      - riscv64
      - mips64
      - mips64le
    binary: cloudflare-utils
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}}
      - -extldflags "-static"
    ignore:
      - goos: windows
        goarch: arm


archives:
  - id: legacy
    formats: ['tar.xz']
    files:
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: completions/*
        info:
          mtime: "{{ .CommitDate }}"
    format_overrides:
      - goos: windows
        formats: ['zip']
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}"

  - id: default
    formats: ['tar.xz']
    format_overrides:
      - goos: windows
        formats: [ 'zip' ]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}"
    files:
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: completions/*
        info:
          mtime: "{{ .CommitDate }}"

  - id: binary
    formats: [ 'binary' ]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

signs:
  - artifacts: all
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

sboms:
  - artifacts: archive

chocolateys:
  - title: "Cloudflare Utils"
    authors: "Cyb3r-Jak3"
    project_url: "https://cloudflare-utils.cyberjake.xyz/"
    docs_url: "https://cloudflare-utils.cyberjake.xyz/"
    license_url: "https://github.com/Cyb3r-Jak3/cloudflare-utils/blob/main/LICENSE"
    summary: "Community created utilities for Cloudflare"
    release_notes: "https://github.com/Cyb3r-Jak3/cloudflare-utils/releases/tag/{{ .Tag }}"
    tags: "cloudflare"
    bug_tracker_url: "https://github.com/Cyb3r-Jak3/cloudflare-utils/issues"
    api_key: '{{ .Env.CHOCOLATEY_API_KEY }}'
    copyright: "2023-2025 Cyb3r-Jak3"
    package_source_url: "https://github.com/Cyb3r-Jak3/cloudflare-utils"
    icon_url: "https://cloudflare-utils.cyberjake.xyz/assets/images/logo.png"
    ids:
      - default
    description: &description |
      Community created utilities for Cloudflare such as:
      
      - Deleting all records in a zone
      - Deleting all records in a zone except for a list of records
      - Deleting all Pages deployments for a branch
      - Deleting all Pages deployments for project
      - Deleting all Pages deployments before or after a time
      
      Cloudflare and the Cloudflare logo are trademarks and/or registered trademarks of Cloudflare, Inc.

nfpms:
  -
    package_name: cloudflare-utils
    vendor: Cyb3rJak3
    homepage: https://cloudflare-utils.cyberjake.xyz/
    maintainer: Cyb3rJak3 <git@cyberjake.xyz>
    description: *description
    license: &license Apache-2.0
    formats:
      - apk
      - deb
      - rpm
    provides:
      - cloudflare-utils
    section: default
    priority: extra

    contents:
      - src: LICENSE
        dst: /usr/share/licenses/{{ .ProjectName }}/LICENSE.md
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: /usr/share/doc/{{ .ProjectName }}/README.md
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: ./completions/{{ .ProjectName }}.bash
        dst: /usr/share/bash-completion/completions/{{ .ProjectName }}
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: ./completions/{{ .ProjectName }}.fish
        dst: /usr/share/fish/vendor_completions.d/{{ .ProjectName }}.fish
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: ./completions/{{ .ProjectName }}.zsh
        dst: /usr/share/zsh/vendor-completions/_{{ .ProjectName }}
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
    ids:
      - default

blobs:
  - provider: s3
    region: auto
    endpoint: https://8be772befd147a8df540aae0fa15c047.r2.cloudflarestorage.com
    bucket: public-files
    ids:
      - default

release:
  draft: true

homebrew_casks:
  - name: cloudflare-utils
    ids:
      - default
    directory: Casks
    description: *description
    license: *license
    homepage: "https://cloudflare-utils.cyberjake.xyz/"
    url:
      verified: "github.com/Cyb3r-Jak3/cloudflare-utils"
    repository:
      owner: Cyb3r-Jak3
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    completions:
      bash: ./completions/{{ .ProjectName }}.bash
      zsh: ./completions/{{ .ProjectName }}.zsh
      fish: ./completions/{{ .ProjectName }}.fish


announce:
  bluesky:
    enabled: true
    username: "releases.cyberjake.xyz"